<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuardFlow β — 警備業務クラウド デモ</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">🛡️ GuardFlow <span class="beta">β demo</span></div>
  <nav class="role-switch">
    <button data-action="role" data-role="guard" id="btn-role-guard">📱 隊員アプリ</button>
    <button data-action="role" data-role="admin" id="btn-role-admin">🖥️ 管制センター</button>
  </nav>
  <div class="top-actions">
    <button data-action="theme" id="btn-theme" title="テーマ切替（自動/ダーク/ライト）">🌓</button>
    <button data-action="load-demo" title="デモ用のサンプルデータを入れる">🧪 デモデータ</button>
    <button data-action="reset" title="登録内容を消して契約直後の初期状態に戻す">↺ 初期状態</button>
  </div>
</header>
<main id="app"></main>
<div id="toast-wrap"></div>
<div id="print-area"></div>
<div id="ask-area"></div>
<script type="module" src="js/app.js?v=7"></script>
</body>
</html>
